name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Lower bound of the duckdb requirement in pyproject.toml.
  DUCKDB_MIN: "1.5.4"

jobs:
  test:
    name: py${{ matrix.python-version }} / duckdb ${{ matrix.duckdb }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        duckdb: [min, max]
        include:
          - os: macos-latest
            python-version: "3.13"
            duckdb: max
          - os: windows-latest
            python-version: "3.13"
            duckdb: max
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.duckdb }}" = "min" ]; then
            pip install "duckdb==${DUCKDB_MIN}"
          fi
          python -c "import duckdb; print('duckdb', duckdb.__version__)"

      # tests/internacia-db.json pins the internacia-db release the SDK is tested against;
      # scripts/data_bump.py (data-bump.yml) updates it.
      - name: Read the tested internacia-db release
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import json
          pin = json.load(open("tests/internacia-db.json"))
          print(f"TESTED_DB_VERSION={pin['version']}")
          print(f"TESTED_DB_SHA256={pin['sha256']}")
          PY

      - name: Cache test database
        uses: actions/cache@v4
        with:
          path: .test-data
          key: internacia-db-${{ env.TESTED_DB_VERSION }}-${{ env.TESTED_DB_SHA256 }}

      - name: Fetch internacia-db ${{ env.TESTED_DB_VERSION }}
        run: >-
          python scripts/fetch_test_db.py
          --version "$TESTED_DB_VERSION"
          --sha256 "$TESTED_DB_SHA256"
          --output .test-data/internacia.duckdb

      - name: Run unit and integration tests
        env:
          INTERNACIA_TEST_DB_PATH: ${{ github.workspace }}/.test-data/internacia.duckdb
          INTERNACIA_TEST_DB_VERSION: ${{ env.TESTED_DB_VERSION }}
        run: pytest -v --cov=internacia --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && matrix.duckdb == 'max'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run black (check only)
        run: black --check internacia/ tests/ examples/ scripts/

      - name: Run ruff
        run: ruff check internacia/ tests/ examples/ scripts/

      - name: Run mypy
        run: mypy internacia/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc
