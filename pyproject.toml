[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "internacia"
dynamic = ["version"]
description = "Python SDK for accessing internacia-db data with support for countries, international blocks, and fuzzy search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Dateno", email = "ibegtin@dateno.io"}
]
keywords = ["countries", "international-organizations", "geography", "data", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.5.4,<3",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=26.1,<27",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "types-requests",
    "types-tqdm",
    "pre-commit>=3.0.0",
]
progress = [
    "tqdm>=4.64.0",
]

[project.urls]
Homepage = "https://github.com/datenoio/internacia-python"
Documentation = "https://github.com/datenoio/internacia-python#readme"
Repository = "https://github.com/datenoio/internacia-python"
Issues = "https://github.com/datenoio/internacia-python/issues"
Changelog = "https://github.com/datenoio/internacia-python/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["internacia"]

[tool.setuptools.package-data]
internacia = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "internacia.version.__version__"}

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs against a real internacia-db DuckDB file (set INTERNACIA_TEST_DB_PATH)",
    "contract: portable data-contract suite run by internacia-db (set INTERNACIA_CONTRACT_DB_PATH)",
]

